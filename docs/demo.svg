<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="-apple-system,'Segoe UI',Roboto,'Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a878"/>
      <stop offset="1" stop-color="#e07b53"/>
    </linearGradient>
  </defs>

  <rect width="860" height="470" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="858" height="468" rx="13" fill="none" stroke="#30363d"/>

  <!-- window chrome -->
  <circle cx="28" cy="30" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="30" r="6" fill="#febc2e"/>
  <circle cx="68" cy="30" r="6" fill="#28c840"/>
  <text x="430" y="35" text-anchor="middle" fill="#8b949e" font-size="13">Claude Desktop</text>

  <!-- user bubble -->
  <rect x="560" y="58" width="272" height="38" rx="10" fill="#1f2937"/>
  <text x="576" y="82" fill="#e6edf3" font-size="14">Connect my Microsoft To Do</text>

  <!-- assistant card -->
  <rect x="28" y="112" width="640" height="168" rx="10" fill="#161b22" stroke="#30363d"/>
  <rect x="44" y="128" width="64" height="22" rx="6" fill="#21262d"/>
  <text x="56" y="143" fill="#7ee787" font-size="12" font-family="ui-monospace,Consolas,monospace">login</text>
  <text x="120" y="143" fill="#8b949e" font-size="12" font-family="ui-monospace,Consolas,monospace">started · loopback listener ready</text>
  <text x="44" y="176" fill="#e6edf3" font-size="14">Open this link and sign in with your Microsoft account:</text>
  <rect x="44" y="188" width="592" height="30" rx="6" fill="#0d1117"/>
  <text x="56" y="208" fill="url(#accent)" font-size="12.5" font-family="ui-monospace,Consolas,monospace">https://login.microsoftonline.com/common/oauth2/v2.0/authorize?client_id=…</text>
  <text x="44" y="248" fill="#8b949e" font-size="13">If the browser cannot reach this machine, paste the final address-bar</text>
  <text x="44" y="266" fill="#8b949e" font-size="13">URL back and I will call login with it to finish.</text>

  <!-- user bubble 2 -->
  <rect x="620" y="296" width="212" height="38" rx="10" fill="#1f2937"/>
  <text x="636" y="320" fill="#e6edf3" font-size="14">Consented ✓ — connected?</text>

  <!-- assistant result card -->
  <rect x="28" y="350" width="804" height="100" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="374" fill="#7ee787" font-size="14">✓ Connected — Microsoft To Do (Tasks.ReadWrite)</text>
  <text x="44" y="398" fill="#c9d1d9" font-size="13" font-family="ui-monospace,Consolas,monospace">任务 3 open   ·   科研学术 2 open   ·   Algorithm 1 open   ·   Video 1 open   ·   校内事务 5 open</text>
  <text x="44" y="422" fill="#8b949e" font-size="13">Try: “把 X 加到科研学术，周五截止” · “搜含论文的任务” · “完成第 3 条”</text>
</svg>
